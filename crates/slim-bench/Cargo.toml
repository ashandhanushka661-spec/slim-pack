[package]
name = "slim-bench"
description = "Criterion benchmarks and competitor codecs for SlimPack (not published)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# RULE: every competitor crate lives ONLY here, so the core crate builds fast.
# Versions are pinned exactly to what was resolved at build time (see
# PROGRESS.md "Pinned dependency versions"). `bincode 3.0.0` is an upstream
# placeholder crate (compile_error!); the real 2.x line is pinned instead.
[dependencies]
slimpack = { path = "../slimpack", version = "0.2.0" }

serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
rmp-serde = "=1.3.1"
postcard = { version = "=1.1.3", features = ["use-std"] }
bincode = "=2.0.1"
bitcode = "=0.6.9"
rkyv = "=0.8.18"
flatbuffers = "=2.1.2"
flate2 = "=1.1.10"
zstd = "=0.14.0"

[dev-dependencies]
criterion = "=0.8.2"
proptest = "=1.11.0"

[[bin]]
name = "gen-datasets"
path = "src/bin/gen_datasets.rs"

[[bench]]
name = "bench"
harness = false

[lib]
name = "slim_bench"
path = "src/lib.rs"